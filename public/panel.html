<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>현재 페이지 로컬 번역</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <main>
      <h1>현재 페이지 로컬 번역</h1>
      <p>
        현재 보이는 Kindle 본문만 기기에서 처리합니다. 최초 실행 시 Chrome 번역
        모델을 다운로드할 수 있습니다. 본문은 외부로 전송하지 않습니다.
      </p>
      <label for="source-language">원본 언어</label>
      <select id="source-language"></select>
      <label for="target-language">번역할 언어</label>
      <select id="target-language"></select>
      <button id="translate" type="button">현재 페이지 번역 · 다시 시도</button>
      <button id="cancel" type="button">취소 · 결과 지우기</button>
      <p id="status" role="status" aria-live="polite">
        Kindle 탭에서 확장 아이콘을 누른 뒤 번역을 시작하세요.
      </p>
      <div id="result" aria-label="번역 결과"></div>
      <p>
        Amazon 또는 Kindle의 공식 제품이 아닙니다. 인식과 번역에 오류가 있을 수
        있습니다.
      </p>
    </main>
    <script src="panel.js"></script>
  </body>
</html>
